<script>
"use strict";
/* =====================================================================
 * 中药房效期预警与盘点管理系统 —— 纯网页演示版（单文件）
 * 数据保存在浏览器 localStorage；业务规则与 Flask 后端版完全一致。
 * ===================================================================== */

/* ---------- 一、RBAC 角色权限矩阵（与后端 rbac.py 一致） ---------- */
const PERMS = {
  admin:  new Set(["dashboard:view","herb:view","herb:edit","batch:view","batch:edit","batch:delete","warning:view","warning:handle","task:view","task:create","task:audit","report:view","log:view","report:export","user:manage"]),
  keeper: new Set(["dashboard:view","herb:view","herb:edit","batch:view","batch:edit","batch:delete","warning:view","task:view","report:view"]),
  expiry: new Set(["dashboard:view","herb:view","batch:view","warning:view","warning:handle","task:view","report:view"]),
  checker:new Set(["dashboard:view","herb:view","batch:view","warning:view","task:view","task:create","report:view"]),
  viewer: new Set(["dashboard:view","herb:view","batch:view","warning:view","task:view","report:view"])
};
const ROLE_NAMES = {admin:"系统管理员",keeper:"库存管理员",expiry:"效期管理员",checker:"盘点员",viewer:"普通查询人员"};
const WARNING_DAYS = 30, PAGE_SIZE = 8;
const DB_KEY = "tcm_web_db_v1", SESSION_KEY = "tcm_web_me";
let db = null, me = null, charts = [];
const ui = {batches:{q:"",state:"",page:1},herbs:{q:"",page:1},tasks:{status:"",page:1},warnings:{state:"",page:1},logs:{page:1}};

/* ---------- 二、工具函数 ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){ return String(n).padStart(2,"0"); }
function dstr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function nowStr(){ const d=new Date(); return dstr(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }
function addDays(base, n){ const d=new Date(base+"T00:00:00"); d.setDate(d.getDate()+n); return dstr(d); }
function daysBetween(expiry, base){
  const a=new Date(expiry+"T00:00:00").getTime(), b=new Date((base||todayStr())+"T00:00:00").getTime();
  return Math.round((a-b)/86400000);
}
function can(p){ return me && PERMS[me.role].has(p); }
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function recordLog(module, action, target, detail){
  db.logs.unshift({at:nowStr(), user:me?me.username:"-", module, action, target:target||"-", detail:detail||""});
  if(db.logs.length>500) db.logs.length=500;
}

/* ---------- 三、效期规则引擎（与后端 expiry_service.py 一致） ---------- */
function evaluate(expiry){
  const days = daysBetween(expiry);
  if(days < 0) return {code:"expired", label:"已过期",   cls:"exp-expired", badge:"exp-badge-expired", days};
  if(days <= WARNING_DAYS) return {code:"warning", label:"临期预警", cls:"exp-warning", badge:"exp-badge-warning", days};
  return {code:"normal", label:"正常", cls:"exp-normal", badge:"", days};
}
function batchStateText(b){
  if(b.status!=="在库") return {code:"out", label:b.status, cls:"text-secondary", badge:"bg-secondary"};
  return evaluate(b.expiryDate);
}

function uid(){ return ++db.seq; }
function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ db = JSON.parse(raw); }catch(e){} }
  if(!db || !db.batches) seedDB();
}
function getHerb(code){ return db.herbs.find(h=>h.code===code); }
function batchByNo(no){ return db.batches.find(b=>b.batchNo===no); }

/* ---------- 五、通用弹窗 / 分页 ---------- */
function showModal(title, body, submitText, onSubmit, size){
  $("#appModal")?.remove();
  const m = document.createElement("div");
  m.className="modal fade"; m.id="appModal"; m.tabIndex=-1;
  m.innerHTML = `<div class="modal-dialog modal-${size||"md"} modal-dialog-centered"><div class="modal-content">
    <form id="appModalForm">
      <div class="modal-header"><h5 class="modal-title">${title}</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer"><button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">取消</button><button class="btn btn-success btn-sm" type="submit">${submitText||"保存"}</button></div>
    </form></div></div>`;
  document.body.appendChild(m);
  const inst = new bootstrap.Modal(m);
  m.querySelector("form").addEventListener("submit", e=>{
    e.preventDefault();
    if(onSubmit(new FormData(e.target), e.target) !== false) inst.hide();
  });
  m.addEventListener("hidden.bs.modal", ()=>m.remove());
  inst.show();
  return m;
}
function toast(msg, ok){
  const t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;border-radius:8px;color:#fff;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);background:"+(ok===false?"#dc2626":"#2e7d32");
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function pager(total, page, key){
  const pages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if(page>pages) page=pages;
  let html=`<nav class="mt-3"><ul class="pagination pagination-sm justify-content-end mb-0">`;
  html+=`<li class="page-item ${page<=1?"disabled":""}"><a class="page-link" data-page="${page-1}" data-pager="${key}">上一页</a></li>`;
  for(let i=1;i<=pages;i++) html+=`<li class="page-item ${i===page?"active":""}"><a class="page-link" data-page="${i}" data-pager="${key}">${i}</a></li>`;
  html+=`<li class="page-item ${page>=pages?"disabled":""}"><a class="page-link" data-page="${page+1}" data-pager="${key}">下一页</a></li>`;
  return html+`</ul></nav>`;
}
function pageSlice(arr, st){ return arr.slice((st.page-1)*PAGE_SIZE, st.page*PAGE_SIZE); }

      <div class="text-center mt-3"><a href="#" id="resetDemo" class="small text-muted">恢复出厂演示数据</a></div>
    </div>
  </div></div>`;

  $("#loginForm").addEventListener("submit", e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const username = (fd.get("username")||"").trim(), password = fd.get("password")||"";
    const msg = $("#loginMsg");
    if(!/^[一-龥A-Za-z0-9]{3,20}$/.test(username) || !/^\S{6,20}$/.test(password)){
      msg.innerHTML=`<div class="alert alert-danger py-2 small">账号或密码格式不正确（账号3-20位，密码6-20位）</div>`; return;
    }
    const now=Date.now();
    const hits=(loginFails[username]||[]).filter(t=>now-t<600000);
    loginFails[username]=hits;
    if(hits.length>=5){ msg.innerHTML=`<div class="alert alert-danger py-2 small">登录失败次数过多，请 10 分钟后再试</div>`; return; }
    const u = db.users.find(x=>x.username===username);
    if(!u || u.password!==password){
      hits.push(now); localStorage.setItem("tcm_web_fails",JSON.stringify(loginFails));
      msg.innerHTML=`<div class="alert alert-danger py-2 small">账号或密码错误，请重新输入</div>`; return;
    }
    if(u.status!==1){ msg.innerHTML=`<div class="alert alert-danger py-2 small">该账号已停用，请联系系统管理员</div>`; return; }
    delete loginFails[username]; localStorage.setItem("tcm_web_fails",JSON.stringify(loginFails));
    me = u; sessionStorage.setItem(SESSION_KEY, username);
    recordLog("登录认证","登录成功",username,"网页演示版登录"); save();
    location.hash = "#/dashboard";
  });
  document.querySelectorAll(".quick-login").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); const u=a.dataset.u;
    const f=$("#loginForm"); f.username.value=u; f.password.value=u+"123";
  }));
  $("#resetDemo").addEventListener("click",e=>{
    e.preventDefault();
    if(confirm("将清空你新增/修改的全部演示数据并恢复出厂状态，确定吗？")){
      localStorage.removeItem("tcm_web_fails"); seedDB(); toast("已恢复出厂演示数据"); renderLogin();
    }
  });
}

/* ---------- 八、工作台 ---------- */
function renderDashboard(){
  const inStock = db.batches.filter(b=>b.status==="在库");
  let warn=0, expired=0;
  inStock.forEach(b=>{ const s=evaluate(b.expiryDate); if(s.code==="warning")warn++; if(s.code==="expired")expired++; });
  const totalQty = inStock.reduce((s,b)=>s+b.quantity,0);
  const pending = db.tasks.filter(t=>t.status!=="已审核").length;
  layout("dashboard", `
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-4 col-xl"><div class="stat-card stat-green"><div class="stat-num">${db.herbs.length}</div><div class="stat-label">药材品种</div></div></div>
      <div class="col-6 col-md-4 col-xl"><div class="stat-card stat-blue"><div class="stat-num">${inStock.length}</div><div class="stat-label">在库批次</div></div></div>
      <div class="col-6 col-md-4 col-xl"><div class="stat-card stat-gray"><div class="stat-num">${totalQty.toLocaleString()}</div><div class="stat-label">库存总量（g）</div></div></div>
      <div class="col-6 col-md-4 col-xl"><div class="stat-card stat-orange"><div class="stat-num">${warn}</div><div class="stat-label">临期预警批次</div></div></div>
      <div class="col-6 col-md-4 col-xl"><div class="stat-card stat-red"><div class="stat-num">${expired}</div><div class="stat-label">已过期批次</div></div></div>
    </div>
    <div class="row g-3">
      <div class="col-lg-5"><div class="card"><div class="card-header p-3">批次效期状态分布</div><div class="card-body"><div id="chartPie" class="chart-box"></div></div></div></div>
      <div class="col-lg-7"><div class="card"><div class="card-header p-3">各批次库存量（g）</div><div class="card-body"><div id="chartBar" class="chart-box"></div></div></div></div>
    </div>
    <div class="card mt-3"><div class="card-header p-3">待办盘点任务（${pending}）</div><div class="card-body p-0 table-scroll">
      <table class="table mb-0"><thead><tr><th>任务单号</th><th>任务名称</th><th>计划日期</th><th>状态</th><th>创建人</th></tr></thead><tbody>
      ${db.tasks.filter(t=>t.status!=="已审核").map(t=>`<tr><td><a href="#/stocktake-detail?id=${t.id}">${t.taskNo}</a></td><td>${esc(t.title)}</td><td>${t.planDate}</td><td>${taskStatusBadge(t.status)}</td><td>${esc(t.createdBy)}</td></tr>`).join("")||`<tr><td colspan="5" class="text-center text-muted py-4">暂无待办任务</td></tr>`}
      </tbody></table>
    </div></div>`);
  drawPie(warn, expired, inStock.length-warn-expired, "#chartPie");
  drawBar(inStock, "#chartBar");
}
function taskStatusBadge(s){
  const map={"待盘点":"bg-secondary","待审核":"bg-warning text-dark","已审核":"bg-success"};
  return `<span class="badge ${map[s]||"bg-secondary"}">${s}</span>`;
}
function disposeCharts(){ charts.forEach(c=>c.dispose()); charts=[]; }
function drawPie(w,e,n,elId){
  const c=echarts.init($(elId||"#chartPie")); charts.push(c);
  c.setOption({tooltip:{trigger:"item"},legend:{bottom:0},
    color:["#2e7d32","#f97316","#dc2626"],
    series:[{type:"pie",radius:["42%","68%"],label:{formatter:"{b}\n{c}批"},data:[
      {value:n,name:"正常"},{value:w,name:"临期预警"},{value:e,name:"已过期"}
    ].filter(x=>x.value>0)}]});
}
function drawBar(list,elId){
  const c=echarts.init($(elId||"#chartBar")); charts.push(c);
  const sorted=[...list].sort((a,b)=>b.quantity-a.quantity);
  c.setOption({tooltip:{trigger:"axis"},grid:{left:60,right:20,top:20,bottom:70},
    xAxis:{type:"category",data:sorted.map(b=>b.batchNo),axisLabel:{rotate:38,fontSize:10}},
    yAxis:{type:"value",name:"g"},
    series:[{type:"bar",data:sorted.map(b=>({value:b.quantity,itemStyle:{color:batchStateText(b).code==="expired"?"#dc2626":batchStateText(b).code==="warning"?"#f97316":"#2e7d32"}}))}]});
}

    <div class="filter-bar">

      <table class="table table-hover mb-0"><thead><tr><th>批次号</th><th>药材</th><th>生产日期</th><th>有效期至</th><th>库存(g)</th><th>单价(元/g)</th><th>供应商</th><th>状态</th>${can("batch:edit")?"<th>操作</th>":""}</tr></thead><tbody>

function batchForm(b){
  const m=showModal(b?"编辑批次":"新增批次",`
    <div class="row g-3">
      <div class="col-6"><label class="form-label small">批次号 <span class="required">*</span></label><input name="batchNo" class="form-control" value="${esc(b?.batchNo||"")}" required></div>
      <div class="col-6"><label class="form-label small">药材 <span class="required">*</span></label>
        <select name="herbCode" class="form-select" id="bfHerb">${db.herbs.map(h=>`<option value="${h.code}" ${b?.herbCode===h.code?"selected":""}>${esc(h.name)}（${h.code}，效期${h.shelfLifeDays}天）</option>`).join("")}</select></div>
      <div class="col-6"><label class="form-label small">生产日期 <span class="required">*</span></label><input type="date" name="productionDate" id="bfProd" class="form-control" value="${b?.productionDate||todayStr()}" required></div>
      <div class="col-6"><label class="form-label small">有效期至 <span class="required">*</span></label><input type="date" name="expiryDate" id="bfExp" class="form-control" value="${b?.expiryDate||""}" required></div>
      <div class="col-6"><label class="form-label small">库存数量(g) <span class="required">*</span></label><input type="number" min="0" step="1" name="quantity" class="form-control" value="${b?.quantity??0}" required></div>
      <div class="col-6"><label class="form-label small">单价(元/g)</label><input type="number" min="0" step="0.01" name="unitPrice" class="form-control" value="${b?.unitPrice??0.1}"></div>
      <div class="col-12"><label class="form-label small">供应商</label><input name="supplier" class="form-control" value="${esc(b?.supplier||"")}"></div>
      <div class="col-12"><label class="form-label small">备注</label><input name="remark" class="form-control" value="${esc(b?.remark||"")}"></div>
    </div>
    <div class="small text-muted mt-2">提示：选择药材并填写生产日期后，有效期自动按该药材默认效期推算，可手工修改。</div>`,"保存",fd=>{
      const no=(fd.get("batchNo")||"").trim();
      const prod=fd.get("productionDate"), exp=fd.get("expiryDate"), qty=parseInt(fd.get("quantity"));
      if(!no){toast("批次号必填",false);return false;}
      if(!b && db.batches.some(x=>x.batchNo===no)){toast("批次号已存在，请核对",false);return false;}
      if(!prod||!exp||exp<prod){toast("有效期不能早于生产日期",false);return false;}
      if(isNaN(qty)||qty<0){toast("库存数量必须是非负整数",false);return false;}
      const obj={batchNo:no,herbCode:fd.get("herbCode"),productionDate:prod,expiryDate:exp,quantity:qty,unitPrice:parseFloat(fd.get("unitPrice"))||0,supplier:fd.get("supplier")||"",remark:fd.get("remark")||""};
      if(b){ Object.assign(b,obj); recordLog("批次库存","编辑批次",no,`有效期至 ${exp}，库存 ${qty}g`); }
      else { db.batches.push({id:uid(),status:"在库",...obj}); recordLog("批次库存","新增批次",no,`药材 ${obj.herbCode}，有效期至 ${exp}`); }
      save(); render(); toast("保存成功");

    if(h&&prod&&!exp.dataset.manual) exp.value=addDays(prod,h.shelfLifeDays);
  };
  m.querySelector("#bfHerb").addEventListener("change",recalc);
  m.querySelector("#bfProd").addEventListener("change",recalc);
  m.querySelector("#bfExp").addEventListener("change",e=>e.target.dataset.manual="1");
  if(!b) recalc();
}

/* ---------- 十一、效期预警 ---------- */
function warningList(){
  const rows=[];
  db.batches.filter(b=>b.status==="在库").forEach(b=>{
    const s=evaluate(b.expiryDate);
    if(s.code==="normal") return;
    rows.push({b,s,handled:db.handles[b.batchNo]});
  });
  return rows.sort((x,y)=>x.s.days-y.s.days);
}
function renderWarnings(){
  const st=ui.warnings;
  let list=warningList();
  if(st.state==="open") list=list.filter(x=>!x.handled);
  if(st.state==="done") list=list.filter(x=>x.handled);
  const rows=pageSlice(list,st);
  layout("warnings",`
    <div class="filter-bar">
      <form class="d-flex gap-2 align-items-center" data-filter="warnings">
        <select name="state" class="form-select form-select-sm" style="max-width:180px">
          <option value="">全部预警</option><option value="open" ${st.state==="open"?"selected":""}>未处理</option><option value="done" ${st.state==="done"?"selected":""}>已处理</option></select>
        <button class="btn btn-outline-success btn-sm">查询</button>
        <span class="small text-muted ms-2">临期阈值 ${WARNING_DAYS} 天，系统按批次有效期每日自动判定</span>
      </form>

function exportCSV(){
  const head=["批次号","药材编号","药材名称","生产日期","有效期至","效期状态","剩余天数","库存数量","单价","库存金额","供应商"];
  const lines=[head.join(",")];
  db.batches.forEach(b=>{const h=getHerb(b.herbCode),s=batchStateText(b);
    lines.push([b.batchNo,b.herbCode,h?.name||"",b.productionDate,b.expiryDate,s.label,s.days,b.quantity,b.unitPrice,(b.quantity*b.unitPrice).toFixed(2),b.supplier].map(v=>`"${String(v).replaceAll('"','""')}"`).join(","));});
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="批次库存报表_"+todayStr()+".csv"; a.click();
  recordLog("报表日志","导出CSV","批次库存报表",`${db.batches.length} 条批次记录`); save();
  toast("CSV 已导出");
}

/* ---------- 十六、全局事件委托 ---------- */
document.addEventListener("click", e=>{
  // 分页
  const pg=e.target.closest("[data-pager]");
  if(pg){ e.preventDefault();
    const key=pg.dataset.pager, p=+pg.dataset.page;
    const total={herbs:db.herbs.length,batches:db.batches.length,tasks:db.tasks.length,warnings:warningList().length,logs:db.logs.length}[key];
    const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
    if(p>=1&&p<=pages){ ui[key].page=p; render(); }
    return;
  }
  const btn=e.target.closest("[data-act]");
  if(!btn) return;
  const act=btn.dataset.act;
  if(act==="herb-new") herbForm(null);
  if(act==="herb-edit") herbForm(db.herbs.find(h=>h.code===btn.dataset.code));
  if(act==="herb-del"){ const h=db.herbs.find(x=>x.code===btn.dataset.code);
    if(db.batches.some(b=>b.herbCode===h.code)){toast("该药材存在批次记录，不能删除",false);return;}
    if(confirm(`确定删除药材「${h.name}」吗？`)){ db.herbs=db.herbs.filter(x=>x!==h); recordLog("药材档案","删除药材",h.code,h.name); save(); render(); toast("已删除"); }
  }
  if(act==="batch-new") batchForm(null);
  if(act==="batch-edit") batchForm(db.batches.find(b=>b.batchNo===btn.dataset.no));
  if(act==="batch-del"){ const b=db.batches.find(x=>x.batchNo===btn.dataset.no);
    if(db.tasks.some(t=>t.items.some(i=>i.batchNo===b.batchNo))){toast("该批次已被盘点任务引用，不能删除",false);return;}
    if(confirm(`确定删除批次「${b.batchNo}」吗？`)){ db.batches=db.batches.filter(x=>x!==b); recordLog("批次库存","删除批次",b.batchNo,""); save(); render(); toast("已删除"); }
  }
  if(act==="warn-handle"){ const no=btn.dataset.no;
    showModal("登记预警处理",`<label class="form-label small">处理措施 / 备注</label>
      <textarea name="remark" class="form-control" rows="3" placeholder="如：已联系供应商退换货 / 已优先调拨使用"></textarea>`,"确认处理",fd=>{
      db.handles[no]={by:me.username,at:nowStr(),remark:fd.get("remark")||"已处理"};
      recordLog("效期预警","登记处理",no,fd.get("remark")||"已处理"); save(); render(); toast("已登记处理");
    });
  }
  if(act==="warn-unhandle"){ const no=btn.dataset.no;
    delete db.handles[no]; recordLog("效期预警","撤销处理",no,""); save(); render();
  }
  if(act==="item-save"){
    const t=currentTask(), it=t.items.find(x=>x.id===+btn.dataset.iid);
    const row=btn.closest("tr"), v=row.querySelector(".actual-input").value;
    const actual=parseInt(v), remark=row.querySelector(".remark-input").value;
    if(v===""||isNaN(actual)||actual<0){toast("请输入有效的实盘数量（非负整数）",false);return;}
    it.actualQty=actual; it.diffQty=actual-it.bookQty; it.remark=remark; it.updatedAt=nowStr();
    recordLog("盘点任务","录入实盘",t.taskNo,`${it.batchNo}：账面${it.bookQty}，实盘${actual}，差异${it.diffQty}`); save(); render();
    toast(`已保存，差异 ${it.diffQty>0?"+":""}${it.diffQty}`);
  }
  if(act==="task-submit"){ const t=currentTask();
    const undone=t.items.filter(i=>i.actualQty===null);
    if(undone.length){toast(`还有 ${undone.length} 个批次未录入实盘`,false);return;}
    t.status="待审核"; t.submittedBy=me.username; t.submittedAt=nowStr();
    recordLog("盘点任务","提交审核",t.taskNo,""); save(); render(); toast("已提交审核");
  }
  if(act==="task-audit-pass"){ const t=currentTask();
    showModal("盘点审核",'<p class="small">任务 <code>'+t.taskNo+'</code> 已完成 '+t.items.length+' 个批次盘点：</p>'
      +'<div class="form-check mb-2"><input type="radio" name="way" class="form-check-input" value="adjust" id="w1" checked><label class="form-check-label" for="w1">审核通过，<b>按实盘数量调整库存</b></label></div>'
      +'<div class="form-check mb-3"><input type="radio" name="way" class="form-check-input" value="keep" id="w2"><label class="form-check-label" for="w2">仅审核通过，<b>库存不作调整</b></label></div>'
      +'<label class="form-label small">审核意见</label><input name="remark" class="form-control" value="差异已查明，审核通过">',
      "确认审核",fd=>{
    const adjust=fd.get("way")==="adjust";
    t.status="已审核"; t.auditedBy=me.username; t.auditedAt=nowStr(); t.adjustStock=adjust;
    t.auditRemark=fd.get("remark")||(adjust?"审核通过，按实盘调账":"审核通过，库存不调整");
    if(adjust) t.items.forEach(i=>{ if(i.diffQty!==0){ const b=batchByNo(i.batchNo); if(b)b.quantity=i.actualQty; }});
    recordLog("盘点任务","审核通过",t.taskNo,t.auditRemark); save(); render();
    toast(adjust?"已审核并按实盘调账":"已审核，库存未调整");
    });
  }
  if(act==="task-audit-reject"){ const t=currentTask();
    const r=prompt("退回原因：","请复核实盘数量"); if(r===null)return;
    t.status="待盘点"; t.auditedBy=me.username; t.auditedAt=nowStr(); t.auditRemark="退回："+r;
    recordLog("盘点任务","审核退回",t.taskNo,r); save(); render(); toast("已退回重盘");
  }
  if(act==="export-csv") exportCSV();
  if(act==="user-new") userForm();
  if(act==="user-pwd"){ const u=db.users.find(x=>x.username===btn.dataset.u);
    showModal("重置密码",`<label class="form-label small">为「${esc(u.realName)}」设置新密码（6-20位）</label><input name="pwd" class="form-control" pattern="\\S{6,20}" required>`,"重置",fd=>{
      u.password=fd.get("pwd"); recordLog("用户管理","重置密码",u.username,""); save(); render(); toast("密码已重置");
    });
  }
  if(act==="user-toggle"){ const u=db.users.find(x=>x.username===btn.dataset.u);
    u.status=u.status?0:1; recordLog("用户管理",u.status?"启用用户":"停用用户",u.username,""); save(); render();
  }
  if(act==="reset-data"){ if(confirm("将清空你新增/修改的全部数据并恢复出厂状态，确定吗？")){ seedDB(); render(); toast("已恢复出厂数据"); } }
});
// 筛选表单
document.addEventListener("submit", e=>{
  const f=e.target.closest("form[data-filter]"); if(!f) return;
  e.preventDefault(); const key=f.dataset.filter; const fd=new FormData(f);
  if("q" in Object.fromEntries(fd)) ui[key].q=(fd.get("q")||"").trim();
  if(fd.has("state")) ui[key].state=fd.get("state");
  if(fd.has("status")) ui[key].status=fd.get("status");
  ui[key].page=1; render();
});
function currentTask(){ const m=location.hash.match(/id=(\d+)/); return db.tasks.find(t=>t.id===+m[1]); }

/* ---------- 十七、路由 ---------- */
const ROUTES={
  dashboard:{perm:"dashboard:view",fn:renderDashboard},
  herbs:{perm:"herb:view",fn:renderHerbs},
  batches:{perm:"batch:view",fn:renderBatches},
  warnings:{perm:"warning:view",fn:renderWarnings},
  stocktake:{perm:"task:view",fn:renderStocktake},
  "stocktake-new":{perm:"task:create",fn:renderStocktakeNew},
  reports:{perm:"report:view",fn:renderReports},
  logs:{perm:"log:view",fn:renderLogs},
  admin:{perm:"user:manage",fn:renderAdmin}
};
function render(){
  disposeCharts();
  if(!me){ renderLogin(); return; }
  const key=(location.hash.replace("#/","")||"dashboard").split("?")[0];
  if(key==="login"||!key){ renderLogin(); return; }
  if(key==="stocktake-detail"){
    const m=location.hash.match(/id=(\d+)/);
    if(!can("task:view")){ layout(key,`<div class="alert alert-danger">403：你没有访问该页面的权限</div>`); return; }
    renderStocktakeDetail(m?+m[1]:0); return;
  }
  const r=ROUTES[key];
  if(!r){ layout(key,`<div class="alert alert-warning">页面不存在</div>`); return; }
  if(!can(r.perm)){ layout(key,`<div class="alert alert-danger">403：你没有访问该页面的权限（当前角色：${ROLE_NAMES[me.role]}）</div>`); return; }
  r.fn();
}
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));

/* ---------- 启动 ---------- */
loadDB();
const savedUser=sessionStorage.getItem(SESSION_KEY);
me = savedUser ? (db.users.find(u=>u.username===savedUser && u.status===1)||null) : null;
if(me){ location.hash = location.hash||"#/dashboard"; } else { location.hash="#/login"; }
render();
</script>
